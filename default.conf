server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    # Behind Cloudflare Tunnel the container speaks HTTP; never trust $scheme/$host.
    set $canon_host ewapevents.nl;

    if ($request_uri ~ ^(.*/)index\.html(\?|$)) {
        return 301 https://$canon_host$1$is_args$args;
    }

    if (-d $request_filename) {
        rewrite [^/]$ https://$canon_host$uri/ permanent;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests" always;

    location = /llm.txt {
        try_files /llm.txt =404;
        default_type text/plain;
        charset utf-8;
    }

    location = /llms.txt {
        try_files /llms.txt =404;
        default_type text/plain;
        charset utf-8;
    }

    location = /security.txt {
        try_files /security.txt =404;
        default_type text/plain;
        charset utf-8;
    }

    location = /.well-known/security.txt {
        try_files /.well-known/security.txt =404;
        default_type text/plain;
        charset utf-8;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        default_type text/plain;
        charset utf-8;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        default_type application/xml;
        charset utf-8;
    }

    location ~* \.(?:js|css|woff2|woff|ttf|png|jpe?g|avif|webp|svg|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
