<?xml version="1.0" encoding="UTF-8"?>
<!-- EWAP · Primary icon · Wind arcs mark · 240×240 base grid -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>EWAP Icon — Wind Arcs</title>
  <desc>Extreme Weather Action Platform primary icon. Three wind arcs: two Deep Navy fronts + one Signal Amber accent arc.</desc>
  <!-- Grid: arcs centered vertically around y=120, stroke-width 18, rounded caps -->
  <g fill="none" stroke-linecap="round">
    <path d="M 40 90 Q 100 50 180 90" stroke="#0B1B34" stroke-width="18"/>
    <path d="M 40 130 Q 110 70 200 130" stroke="#0B1B34" stroke-width="18"/>
    <path d="M 40 170 Q 120 100 210 170" stroke="#F5A524" stroke-width="18"/>
  </g>
  <!-- Terminal accent dot on amber arc -->
  <circle cx="210" cy="170" r="10" fill="#F5A524"/>
</svg>
