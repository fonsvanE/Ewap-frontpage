<?xml version="1.0" encoding="UTF-8"?>
<!-- EWAP stacked lockup for dark surfaces (never navy-on-black) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>EWAP Stacked Lockup On Dark</title>
  <g transform="translate(80,40)">
    <g fill="none" stroke-linecap="round">
      <path d="M 40 90 Q 100 50 180 90" stroke="#FFFFFF" stroke-width="18"/>
      <path d="M 40 130 Q 110 70 200 130" stroke="#FFFFFF" stroke-width="18"/>
      <path d="M 40 170 Q 120 100 210 170" stroke="#F5A524" stroke-width="18"/>
    </g>
    <circle cx="210" cy="170" r="10" fill="#F5A524"/>
  </g>
  <text x="200" y="380" text-anchor="middle" font-size="90" font-weight="800" fill="#FFFFFF" letter-spacing="-3">EWAP</text>
  <text x="200" y="420" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EAF2" letter-spacing="1">EXTREME WEATHER ACTION</text>
</svg>
